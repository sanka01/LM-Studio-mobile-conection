<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LM Studio Mobile Chat</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 800px; margin: 0 auto; padding: 16px; }
      h1 { margin-top: 8px; }
      .chat { border: 1px solid #ddd; border-radius: 8px; padding: 12px; min-height: 280px; margin-bottom: 12px; }
      .msg { margin: 10px 0; white-space: pre-wrap; }
      .user { color: #0b57d0; }
      .assistant { color: #137333; }
      .pending { color: #666; font-style: italic; }
      textarea { width: 100%; min-height: 88px; }
      button { margin-top: 8px; padding: 10px 14px; }
      .hint { color: #666; font-size: 0.9rem; }
      .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
      select { padding: 8px; max-width: 100%; flex: 1; }
      #status { color: #444; font-size: 0.9rem; min-height: 1.2em; margin: 8px 0; }
    </style>
  </head>
  <body>
    <h1>LM Studio Mobile Chat</h1>
    <p class="hint">Conectado ao relay local exposto por túnel seguro.</p>

    <div class="row">
      <select id="modelSelect">
        <option value="">Carregando modelos...</option>
      </select>
      <button id="reloadModels" type="button">Atualizar modelos</button>
    </div>

    <div id="chat" class="chat"></div>
    <p id="status"></p>

    <textarea id="input" placeholder="Digite sua mensagem..."></textarea>
    <button id="send">Enviar</button>

    <script>
      const chatEl = document.getElementById('chat');
      const inputEl = document.getElementById('input');
      const sendBtn = document.getElementById('send');
      const modelSelectEl = document.getElementById('modelSelect');
      const reloadModelsBtn = document.getElementById('reloadModels');
      const statusEl = document.getElementById('status');

      function appendMsg(role, text, extraClass = '') {
        const div = document.createElement('div');
        div.className = `msg ${role} ${extraClass}`.trim();
        div.textContent = `${role === 'user' ? 'Você' : 'Assistente'}: ${text}`;
        chatEl.appendChild(div);
        chatEl.scrollTop = chatEl.scrollHeight;
        return div;
      }

      function updateMsg(el, role, text, extraClass = '') {
        el.className = `msg ${role} ${extraClass}`.trim();
        el.textContent = `${role === 'user' ? 'Você' : 'Assistente'}: ${text}`;
        chatEl.scrollTop = chatEl.scrollHeight;
      }

      function parseSseBlocks(rawBlock) {
        const lines = rawBlock.split('\n');
        let event = 'message';
        let data = '';

        lines.forEach((line) => {
          if (line.startsWith('event:')) event = line.slice(6).trim();
          if (line.startsWith('data:')) data += line.slice(5).trim();
        });

        if (!data) return null;

        try {
          return { event, payload: JSON.parse(data) };
        } catch {
          return null;
        }
      }

      async function sendMessage() {
        const message = inputEl.value.trim();
        if (!message) return;
        const model = modelSelectEl.value;
        if (!model) {
          appendMsg('assistant', 'Selecione um modelo antes de enviar.');
          return;
        }

        appendMsg('user', message);
        inputEl.value = '';
        sendBtn.disabled = true;
        modelSelectEl.disabled = true;
        reloadModelsBtn.disabled = true;

        const assistantLine = appendMsg('assistant', 'Aguardando geração da resposta…', 'pending');
        let assistantText = '';

        const startAt = Date.now();
        const timer = setInterval(() => {
          const elapsed = Math.floor((Date.now() - startAt) / 1000);
          statusEl.textContent = `Gerando resposta... ${elapsed}s`;
          if (!assistantText) {
            const dots = '.'.repeat((elapsed % 3) + 1);
            updateMsg(assistantLine, 'assistant', `Aguardando geração da resposta${dots}`, 'pending');
          }
        }, 500);

        try {
          const resp = await fetch('/api/chat/stream', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message, model })
          });

          if (!resp.ok || !resp.body) {
            const data = await resp.json().catch(() => ({}));
            throw new Error(data.error || 'Falha desconhecida no streaming.');
          }

          const reader = resp.body.getReader();
          const decoder = new TextDecoder('utf-8');
          let buffer = '';

          while (true) {
            const { value, done } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const blocks = buffer.split('\n\n');
            buffer = blocks.pop() || '';

            for (const block of blocks) {
              const parsed = parseSseBlocks(block.trim());
              if (!parsed) continue;

              if (parsed.event === 'token') {
                assistantText = parsed.payload.answer || `${assistantText}${parsed.payload.token || ''}`;
                updateMsg(assistantLine, 'assistant', assistantText || '(sem resposta)');
              } else if (parsed.event === 'error') {
                throw new Error(parsed.payload.error || 'Erro de streaming.');
              } else if (parsed.event === 'done') {
                assistantText = parsed.payload.answer || assistantText;
                updateMsg(assistantLine, 'assistant', assistantText || '(sem resposta)');
              }
            }
          }
        } catch (error) {
          updateMsg(assistantLine, 'assistant', `Erro de conexão: ${error.message}`);
        } finally {
          clearInterval(timer);
          statusEl.textContent = '';
          sendBtn.disabled = false;
          modelSelectEl.disabled = false;
          reloadModelsBtn.disabled = false;
          inputEl.focus();
        }
      }

      sendBtn.addEventListener('click', sendMessage);
      async function loadModels() {
        modelSelectEl.innerHTML = '<option value="">Carregando modelos...</option>';
        modelSelectEl.disabled = true;
        reloadModelsBtn.disabled = true;

        try {
          const resp = await fetch('/api/models');
          const data = await resp.json();
          if (!resp.ok) throw new Error(data.error || 'Falha ao listar modelos.');

          const models = Array.isArray(data.models) ? data.models : [];
          if (models.length === 0) {
            modelSelectEl.innerHTML = '<option value="">Nenhum modelo disponível</option>';
            return;
          }

          const defaultModel = data.defaultModel;
          modelSelectEl.innerHTML = '';
          models.forEach((m) => {
            const option = document.createElement('option');
            option.value = m;
            option.textContent = m;
            modelSelectEl.appendChild(option);
          });
          if (defaultModel && models.includes(defaultModel)) {
            modelSelectEl.value = defaultModel;
          }
        } catch (error) {
          modelSelectEl.innerHTML = '<option value="">Erro ao carregar modelos</option>';
          appendMsg('assistant', `Erro ao listar modelos: ${error.message}`);
        } finally {
          modelSelectEl.disabled = false;
          reloadModelsBtn.disabled = false;
        }
      }

      reloadModelsBtn.addEventListener('click', loadModels);
      inputEl.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          sendMessage();
        }
      });
      loadModels();
    </script>
  </body>
</html>
